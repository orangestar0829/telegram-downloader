[project]
name = "tgdl"
version = "1.3.4"
description = "Download photos and videos from Telegram channels you already joined."
requires-python = ">=3.10"
dependencies = [
  "telethon>=1.44.0,<2.0.0",
  "python-dotenv>=1.2.3,<2",
  "tqdm>=4.66.0",
  "aiohttp>=3.9.0",
  "Pillow>=10.0.0",
  "qrcode>=7.4.2,<9",
  "python-socks[asyncio]>=2.4.0,<3",
  "cryptg>=0.4.0,<1",
]

[project.scripts]
tgdl = "tgdl.cli:main"

[project.gui-scripts]
tgdl-gui = "tgdl.gui:run_gui"
